[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]>=0.27.0,!=0.29.0",
    "sqlalchemy[asyncio]==2.0.29",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pyyaml==6.0.1",
    "cryptography==42.0.5",
    "httpx==0.27.0",
    "redis[asyncio]==5.0.3",
    "prefect>=2.19.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
